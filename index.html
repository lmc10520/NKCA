<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NKCA 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400,0..1,0&display=block" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.8/build/index.module.js"
} }
</script>
</head>
<body>
<div id="app">
  <canvas id="view"></canvas>
  <div id="labels"></div>

  <!-- 左上：指北針（只指真北）＋視角方塊＋視角切換 -->
  <div id="navTL" class="ui">
    <button id="compass" class="fab small" title="真北（點一下轉成北朝上）">
      <svg viewBox="0 0 48 48"><g id="compassRose"><path d="M24 6 L29.5 24 L18.5 24 Z" class="n"/><path d="M24 42 L18.5 24 L29.5 24 Z" class="s"/><text x="24" y="17.5" class="nt">N</text></g></svg>
    </button>
    <div id="viewCube" title="點角落：等角視角；點面：俯視／立面">
      <div id="cubeCam"></div>
    </div>
    <div id="viewPad" class="pad3">
      <span></span><button data-view="back" title="北立面（+Y）">北</button><span></span>
      <button data-view="left" title="西立面（−X）">西</button><button data-view="top" title="俯視" class="mid">俯</button><button data-view="right" title="東立面（+X）">東</button>
      <span></span><button data-view="front" title="南立面（−Y）">南</button><span></span>
    </div>
  </div>

  <!-- 上方：模式切換（分段按鈕） -->
  <div id="modeBar" class="ui seg"></div>

  <!-- 右上：時間與天氣（純文字） -->
  <div id="clock" class="ui">
    <div id="clockTime">--:--</div>
    <div id="clockDate"></div>
    <div id="weather"></div>
  </div>

  <!-- 右側：樓層選擇（像 Google 地圖室內樓層） -->
  <div id="liftPanel" class="ui hidden">
    <div class="liftTitle" id="liftTitle"></div>
    <div class="liftButtons" id="liftButtons"></div>
  </div>

  <!-- 左下：設定（所有瀏覽相關設定收在這裡） -->
  <button id="settingsBtn" class="ui fab" title="設定"><span class="ms">tune</span></button>
  <div id="settings" class="ui sheet hidden">
    <div class="setHead"><span>瀏覽設定</span><button class="x ms" id="settingsClose" aria-label="關閉">close</button></div>
    <div class="setSec">顯示</div>
    <div class="setRow"><span class="ms">label</span>標籤<label class="sw"><input type="checkbox" data-tg="labels" checked><i></i></label></div>
    <div class="setRow"><span class="ms">schedule</span>時間<label class="sw"><input type="checkbox" data-tg="clock" checked><i></i></label></div>
    <div class="setRow"><span class="ms">partly_cloudy_day</span>天氣<label class="sw"><input type="checkbox" data-tg="weather" checked><i></i></label></div>
    <div class="setRow"><span class="ms">directions_car</span>人車<label class="sw"><input type="checkbox" data-tg="traffic" checked><i></i></label></div>
    <div class="setRow"><span class="ms">wb_twilight</span>指定時間<button class="text" id="openTime">調整</button></div>
    <div class="setSec">模型樣式</div>
    <div class="seg2" id="styleSeg"><button data-style="normal" class="on">一般</button><button data-style="contrast">高對比</button><button data-style="wire">線架構</button></div>
    <div class="setRow" id="lineRow"><span class="ms">line_weight</span>線條粗細<input type="range" id="lineW" min="1" max="6" step="0.5" value="2"><b id="lineWv">2</b></div>
    <div class="setSec">投影</div>
    <div class="seg2" id="projSeg"><button data-proj="persp" class="on">透視</button><button data-proj="ortho">等角（平行）</button></div>
    <div class="setSec">簡報</div>
    <div class="setRow"><span class="ms">bookmark_add</span>記住目前畫面<button class="text" id="snapBtn">複製代碼</button></div>
    <div class="setRow"><span class="ms">slideshow</span>簡報模式<button class="text" id="presBtn">匯入 txt</button></div>
    <div class="setNote">txt 格式：每頁一行代碼，下方可寫 <code># 標題</code>、<code>## 副標</code>、一般文字為內文；<code>//</code> 開頭為註記不顯示。<a href="docs/簡報範例.txt" download>下載範例</a></div>
  </div>

  <!-- 時間選擇（24 小時制，時、分分開滾選） -->
  <div id="timeSlider" class="ui sheet hidden">
    <div class="tpHead"><span class="ms">schedule</span><span>選擇時間</span><span id="timeLabel" class="tpState"></span></div>
    <div class="tp">
      <div class="tpCol" id="tpH"></div>
      <div class="tpColon">:</div>
      <div class="tpCol" id="tpM"></div>
      <div class="tpBand"></div>
    </div>
    <div class="tpActions"><button id="timeLive" class="text">回到現在</button><button id="timeDone" class="text">完成</button></div>
  </div>

  <!-- 彈出視窗（地下停車場平面圖等） -->
  <div id="modal" class="hidden"><div class="modalInner"><button class="x ms" id="modalClose">close</button><h3 id="modalTitle"></h3><img id="modalImg" alt=""><p id="modalNote"></p></div></div>

  <!-- 簡報文字框（只在簡報時顯示，不存在瀏覽器裡） -->
  <div id="presText" class="ui hidden"><h1></h1><h2></h2><div class="pt"></div></div>

  <!-- 簡報模式控制 -->
  <div id="presBar" class="ui sheet hidden">
    <button id="presPrev" class="icon" title="上一個"><span class="ms">skip_previous</span></button>
    <span id="presIdx">0/0</span>
    <button id="presNext" class="icon" title="下一個"><span class="ms">skip_next</span></button>
    <button id="presExit" class="icon" title="結束簡報"><span class="ms">close</span></button>
  </div>
  <input type="file" id="presFile" accept=".txt,text/plain" hidden>

  <div id="toast" class="hidden"></div>
  <div id="loading"><div class="bar"><div id="loadBar"></div></div><div id="loadText">載入模型中…</div><div id="loadNote">NKCA 3D · 非官方模型，僅供教育訓練使用</div></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
