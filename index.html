<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NKCA 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400,0..1,0&display=block" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.8/build/index.module.js"
} }
</script>
</head>
<body>
<div id="app">
  <canvas id="view"></canvas>
  <div id="screenLayers"></div>
  <div id="labels"></div>

  <!-- 左上：指北針（只指真北）＋視角方塊＋視角切換 -->
  <div id="navTL" class="ui">
    <button id="compass" class="fab small" title="真北（點一下轉成北朝上）">
      <svg viewBox="0 0 48 48"><g id="compassRose"><path d="M24 6 L29.5 24 L18.5 24 Z" class="n"/><path d="M24 42 L18.5 24 L29.5 24 Z" class="s"/><text x="24" y="17.5" class="nt">N</text></g></svg>
    </button>
    <div id="viewCube" title="點面：俯視／立面；點角：等角視角">
      <div id="cubeCam"></div>
      <svg id="cubeAxes" viewBox="-50 -50 100 100"></svg>
      <button id="cubeHome" class="ms" title="回到起始視角">home</button>
    </div>
  </div>

  <!-- 上方：模式切換（分段按鈕） -->
  <div id="modeBar" class="ui seg"></div>

  <!-- 右上：時間與天氣（純文字） -->
  <div id="clock" class="ui">
    <div id="clockTime">--:--</div>
    <div id="clockDate"></div>
    <div id="weather"></div>
  </div>

  <!-- 右上：概覽（分類定點導覽） -->
  <button id="ovBtn" class="ui"><span class="ms">explore</span>概覽</button>
  <div id="ovDrawer" class="ui sheet">
    <div class="setHead"><span>概覽</span><button class="x ms" id="ovClose" aria-label="關閉">close</button></div>
    <div id="ovList"></div>
  </div>

  <!-- 右側：樓層選擇（像 Google 地圖室內樓層） -->
  <div id="liftPanel" class="ui hidden">
    <div class="liftTitle" id="liftTitle"></div>
    <div class="liftButtons" id="liftButtons"></div>
  </div>

  <!-- 左下：設定（所有瀏覽相關設定收在這裡） -->
  <button id="settingsBtn" class="ui fab" title="設定"><span class="ms">tune</span></button>
  <div id="settings" class="ui sheet hidden">
    <div class="setHead"><span>瀏覽設定</span><button class="x ms" id="settingsClose" aria-label="關閉">close</button></div>
    <div class="welcomeRow">
      <button id="welcomeBtn" class="welcomeBtn"><span class="ms">screenshot_monitor</span>開啟迎賓模式</button>
      <button id="welcomePureBtn" class="welcomeMini" title="純轉動模式（只有轉動的模型，不顯示時間、天氣與提示文字）"><span class="ms">3d_rotation</span></button>
    </div>
    <div class="setSec">顯示</div>
    <div class="setRow"><span class="ms">label</span>標籤<label class="sw"><input type="checkbox" data-tg="labels" checked><i></i></label></div>
    <div class="setRow"><span class="ms">schedule</span>時間<label class="sw"><input type="checkbox" data-tg="clock" checked><i></i></label></div>
    <div class="setRow"><span class="ms">partly_cloudy_day</span>天氣<label class="sw"><input type="checkbox" data-tg="weather" checked><i></i></label></div>
    <div class="setRow"><span class="ms">directions_car</span>人車<label class="sw"><input type="checkbox" data-tg="traffic" checked><i></i></label></div>
    <div class="setRow"><span class="ms">lightbulb</span>場館燈光<button class="text hidden" id="venueAuto" title="回到依營運時間自動開關">自動</button><label class="sw"><input type="checkbox" id="venueSw" checked><i></i></label></div>
    <div class="setRow hidden" id="festRow"><span class="ms">celebration</span><span id="festName">節慶物件</span><label class="sw"><input type="checkbox" data-tg="festival" checked><i></i></label></div>
    <div class="setRow"><span class="ms">wb_twilight</span>指定時間<button class="text" id="openTime">調整</button></div>
    <div class="setSec">建築聲景</div>
    <div class="setRow"><span class="ms">graphic_eq</span>環境聲音<label class="sw"><input type="checkbox" id="soundSw" checked><i></i></label></div>
    <div class="setRow"><span class="ms">volume_down</span>環境音量<input type="range" id="soundVol" min="0" max="1" step="0.01" value="0.7"><b id="soundVolV">70</b></div>
    <div class="soundZone" id="soundZone"></div>
    <div class="setSec">天氣預覽</div>
    <div class="seg2 icons" id="wxSeg"><button data-wx="live" class="on" title="即時天氣"><span class="ms">sensors</span></button><button data-wx="clear" title="晴"><span class="ms">sunny</span></button><button data-wx="cloudy" title="陰"><span class="ms">cloud</span></button><button data-wx="rain" title="雨"><span class="ms">rainy</span></button><button data-wx="snow" title="雪"><span class="ms">weather_snowy</span></button><button data-wx="storm" title="颱風（閃電）"><span class="ms">thunderstorm</span></button><button data-wx="aurora" title="極光"><span class="ms">auto_awesome</span></button></div>
    <div class="wxName" id="wxName">即時</div>
    <div class="setSec">模型樣式</div>
    <div class="seg2" id="styleSeg"><button data-style="normal" class="on">一般</button><button data-style="contrast">高對比</button><button data-style="wire">線架構</button></div>
    <div class="setRow" id="lineRow"><span class="ms">line_weight</span>線條粗細<input type="range" id="lineW" min="1" max="6" step="0.5" value="2"><b id="lineWv">2</b></div>
    <div class="setSec">投影</div>
    <div class="seg2" id="projSeg"><button data-proj="persp" class="on">透視</button><button data-proj="ortho">等角（平行）</button></div>
    <div class="setSec">簡報</div>
    <div class="presRow">
      <button class="iconBtn" id="snapBtn" title="記住目前畫面（複製代碼）"><span class="ms">bookmark_add</span></button>
      <button class="iconBtn" id="presBtn" title="簡報模式（匯入 txt，可連同 svg／圖片一起選取）"><span class="ms">slideshow</span></button>
      <button class="iconBtn" id="planBtn" title="下載平面底圖（俯視、北朝上，給 @svg 平面圖層用）"><span class="ms">map</span></button>
      <button class="iconBtn" id="viewBtn" title="下載目前畫面底圖（任意視角，給 @screen 畫面圖層用；同時複製這個畫面的代碼）"><span class="ms">add_photo_alternate</span></button>
    </div>
    <div class="presRow">
      <form id="lessonForm" class="lessonBox"><input id="lessonCode" placeholder="教學代碼" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="ms" title="開啟教學">search</button></form>
    </div>
  </div>

  <!-- 時間選擇（24 小時制，時、分分開滾選） -->
  <div id="timeSlider" class="ui sheet hidden">
    <div class="tpHead"><span class="ms">schedule</span><span>選擇時間</span><span id="timeLabel" class="tpState"></span></div>
    <div class="tp">
      <div class="tpCol" id="tpH"></div>
      <div class="tpColon">:</div>
      <div class="tpCol" id="tpM"></div>
      <div class="tpBand"></div>
    </div>
    <div class="tpActions"><button id="timeLive" class="text">回到現在</button><button id="timeDone" class="text">完成</button></div>
  </div>

  <!-- 彈出視窗（地下停車場平面圖等） -->
  <div id="modal" class="hidden"><div class="modalInner"><button class="x ms" id="modalClose">close</button><h3 id="modalTitle"></h3><div id="mapView"><img id="modalImg" alt="" draggable="false"><div id="mapZoom"><button class="ms" id="zIn" title="放大">add</button><button class="ms" id="zOut" title="縮小">remove</button><button class="ms" id="zFit" title="符合畫面">fit_screen</button></div></div><p id="modalNote"></p></div></div>

  <!-- 簡報文字框（只在簡報時顯示，不存在瀏覽器裡） -->
  <div id="presText" class="ui hidden"><h1></h1><h2></h2><div class="pt"></div></div>

  <!-- 簡報模式控制 -->
  <div id="presBar" class="ui sheet hidden">
    <button id="presPrev" class="icon" title="上一個"><span class="ms">skip_previous</span></button>
    <span id="presIdx">0/0</span>
    <button id="presNext" class="icon" title="下一個"><span class="ms">skip_next</span></button>
    <button id="presExit" class="icon" title="結束簡報"><span class="ms">close</span></button>
  </div>
  <input type="file" id="presFile" accept=".txt,text/plain,.svg,image/*" multiple hidden>

  <!-- 右下：建築聲景開關（記住選擇；第一次點擊畫面後才能出聲） -->
  <button id="soundBtn" class="ui fab small" title="環境聲音（建築聲景）"><span class="ms">volume_up</span></button>
  <div id="soundHint" class="ui hidden"><span class="ms">touch_app</span>點一下畫面，開啟建築聲景</div>

  <!-- 公共鋼琴提示：滑鼠移到鋼琴上時跟著游標；手機在鋼琴上方常駐 -->
  <div id="pianoTip" class="ui hidden"><span class="ms">piano</span><span class="t"></span></div>

  <div id="toast" class="hidden"></div>
  <div id="loading"><div id="loadPct">0<small>%</small></div><div class="bar"><div id="loadBar"></div></div><div id="loadText">載入模型中…</div></div>
  <div id="welcomeHint" class="hidden">點一下或拖曳畫面開始瀏覽</div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
