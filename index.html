<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NKCA 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400,0..1,0&display=block" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <canvas id="view"></canvas>
  <div id="labels"></div>

  <!-- 左上：指北針（像 Google 地圖的羅盤） -->
  <button id="compass" class="ui fab small" title="回正北">
    <svg viewBox="0 0 48 48"><g id="compassRose"><path d="M24 7 L29.5 24 L18.5 24 Z" class="n"/><path d="M24 41 L18.5 24 L29.5 24 Z" class="s"/></g></svg>
  </button>

  <!-- 上方：模式切換（分段按鈕） -->
  <div id="modeBar" class="ui seg"></div>

  <!-- 右上：時間與天氣（純文字） -->
  <div id="clock" class="ui">
    <div id="clockTime">--:--</div>
    <div id="clockDate"></div>
    <div id="weather"></div>
  </div>

  <!-- 右側：樓層選擇（像 Google 地圖室內樓層） -->
  <div id="liftPanel" class="ui hidden">
    <div class="liftTitle" id="liftTitle"></div>
    <div class="liftButtons" id="liftButtons"></div>
  </div>

  <!-- 下方左：篩選晶片 -->
  <div id="toolbar" class="ui chips">
    <button data-tool="labels" class="chip on"><span class="ms">label</span>標籤</button>
    <button data-tool="cards" class="chip on"><span class="ms">info</span>資訊卡</button>
    <button data-tool="clock" class="chip on"><span class="ms">schedule</span>時間</button>
    <button data-tool="weather" class="chip on"><span class="ms">partly_cloudy_day</span>天氣</button>
    <button data-tool="contrast" class="chip"><span class="ms">contrast</span>高對比</button>
    <button data-tool="wire" class="chip"><span class="ms">deployed_code</span>線架構</button>
  </div>

  <!-- 下方右：動作按鈕 -->
  <div id="fabs" class="ui">
    <button data-tool="time" class="fab" title="調整時間"><span class="ms">tune</span></button>
    <button data-tool="snap" class="fab" title="簡報記憶：複製目前畫面的代碼"><span class="ms">bookmark_add</span></button>
    <button data-tool="present" class="fab primary" title="簡報模式：匯入代碼檔"><span class="ms">slideshow</span></button>
  </div>

  <!-- 時間選擇（24 小時制，時、分分開滾選） -->
  <div id="timeSlider" class="ui sheet hidden">
    <div class="tpHead"><span class="ms">schedule</span><span>選擇時間</span><span id="timeLabel" class="tpState"></span></div>
    <div class="tp">
      <div class="tpCol" id="tpH"></div>
      <div class="tpColon">:</div>
      <div class="tpCol" id="tpM"></div>
      <div class="tpBand"></div>
    </div>
    <div class="tpActions"><button id="timeLive" class="text">回到現在</button><button id="timeDone" class="text">完成</button></div>
  </div>

  <!-- 資訊卡 -->
  <div id="card" class="ui sheet hidden"><button class="x ms" id="cardClose">close</button><h3 id="cardTitle"></h3><div id="cardBody"></div></div>

  <!-- 彈出視窗（地下停車場平面圖等） -->
  <div id="modal" class="hidden"><div class="modalInner"><button class="x ms" id="modalClose">close</button><h3 id="modalTitle"></h3><img id="modalImg" alt=""><p id="modalNote"></p></div></div>

  <!-- 簡報模式控制 -->
  <div id="presBar" class="ui sheet hidden">
    <button id="presPrev" class="icon" title="上一個"><span class="ms">skip_previous</span></button>
    <span id="presIdx">0/0</span>
    <button id="presNext" class="icon" title="下一個"><span class="ms">skip_next</span></button>
    <button id="presExit" class="icon" title="結束簡報"><span class="ms">close</span></button>
  </div>
  <input type="file" id="presFile" accept=".txt,text/plain" hidden>

  <div id="toast" class="hidden"></div>
  <div id="loading"><div class="bar"><div id="loadBar"></div></div><div id="loadText">載入模型中…</div><div id="loadNote">NKCA 3D · 非官方模型，僅供教育訓練使用</div></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
